<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Szülői felület — Basic Táncstúdió</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --green:      #3D7A68;
  --green-bg:   #EAF2EF;
  --green-mid:  #6AA898;
  --green-dark: #2A5E50;
  --green-deep: #1E4A3E;
  --cream:      #F5F0E8;
  --ivory:      #FAF8F5;
  --ivory2:     #F2EDE7;
  --charcoal:   #1E1C1A;
  --text-mid:   #4A4540;
  --text-soft:  #8A837C;
  --border:     #DDD6CE;
  --border-lt:  #EDE7E1;
  --shadow-sm:  0 2px 12px rgba(30,28,26,0.06);
  --shadow-md:  0 8px 32px rgba(30,28,26,0.12);
  --shadow-lg:  0 20px 60px rgba(30,28,26,0.14);
  --red:        #C0392B;
  --orange:     #E67E22;
}
html, body { height: 100%; }
body { font-family: 'Inter', sans-serif; background: var(--ivory); color: var(--charcoal); font-size: 16px; }

/* HEADER */
.header { background: var(--green-deep); padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between; box-shadow: var(--shadow-md); }
.header-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.header-logo { width: 36px; height: 36px; border-radius: 50%; object-fit: contain; background: white; padding: 4px; }
.header-name { font-family: 'Cormorant Garamond', serif; font-size: 1rem; color: white; letter-spacing: 0.08em; text-transform: uppercase; }
.header-badge { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--green-mid); background: rgba(106,168,152,0.15); padding: 4px 10px; border: 1px solid rgba(106,168,152,0.3); }
.header-logout { font-size: 11px; color: rgba(255,255,255,0.5); background: none; border: none; cursor: pointer; font-family: 'Inter', sans-serif; letter-spacing: 0.06em; display: none; }
.header-logout:hover { color: white; }

/* LOGIN */
.login-wrap { min-height: calc(100vh - 68px); display: flex; align-items: center; justify-content: center; padding: 2rem; }
.login-card { background: white; padding: 3rem 2.5rem; width: 100%; max-width: 380px; box-shadow: var(--shadow-lg); text-align: center; }
.login-logo { width: 80px; height: 80px; border-radius: 50%; border: 3px solid var(--cream); object-fit: contain; margin: 0 auto 1.5rem; display: block; padding: 8px; background: var(--ivory); }
.login-title { font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; font-weight: 300; color: var(--charcoal); margin-bottom: 0.4rem; }
.login-sub { font-size: 13px; color: var(--text-soft); margin-bottom: 2.5rem; }
.pin-label { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-soft); margin-bottom: 0.75rem; display: block; text-align: left; }
.pin-input {
  width: 100%; padding: 16px; text-align: center;
  font-size: 2rem; letter-spacing: 0.5em; font-family: 'Inter', sans-serif;
  background: var(--ivory); border: 1px solid var(--border);
  color: var(--charcoal); outline: none; transition: border-color 0.2s;
  margin-bottom: 1rem;
}
.pin-input:focus { border-color: var(--green); }
.pin-input.error { border-color: var(--red); animation: shake 0.3s ease; }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
.pin-error { font-size: 13px; color: var(--red); margin-bottom: 1rem; display: none; }
.pin-error.show { display: block; }
.login-btn { width: 100%; padding: 15px; background: var(--green); color: white; border: none; font-size: 13px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; font-family: 'Inter', sans-serif; transition: background 0.2s; box-shadow: 0 4px 16px rgba(61,122,104,0.3); }
.login-btn:hover { background: var(--green-dark); }

/* DASHBOARD */
.dashboard { display: none; }
.main { max-width: 520px; margin: 0 auto; padding: 1.5rem; }

/* CHILD HEADER */
.child-header { background: var(--green-deep); margin: -1.5rem -1.5rem 1.5rem; padding: 1.5rem; display: flex; align-items: center; gap: 1rem; }
.child-avatar { width: 52px; height: 52px; border-radius: 50%; background: var(--green); border: 2px solid var(--green-mid); display: flex; align-items: center; justify-content: center; font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; color: white; flex-shrink: 0; }
.child-name { font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; font-weight: 300; color: white; }
.child-group { font-size: 11px; color: var(--green-mid); letter-spacing: 0.08em; margin-top: 2px; }

/* CARDS */
.card { background: white; border: 1px solid var(--border-lt); box-shadow: var(--shadow-sm); margin-bottom: 1rem; overflow: hidden; }
.card-header { padding: 1rem 1.25rem; border-bottom: 1px solid var(--border-lt); display: flex; align-items: center; justify-content: space-between; }
.card-title { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-soft); }
.card-action { font-size: 12px; color: var(--green); cursor: pointer; background: none; border: none; font-family: 'Inter', sans-serif; }
.card-body { padding: 1.25rem; }

/* FIZETÉS */
.payment-status { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.25rem; }
.payment-badge { padding: 6px 14px; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; }
.payment-badge.paid { background: var(--green-bg); color: var(--green-dark); }
.payment-badge.unpaid { background: #FDECEA; color: var(--red); }
.payment-month { font-size: 14px; color: var(--text-mid); }
.payment-note { font-size: 12px; color: var(--text-soft); font-style: italic; margin-top: 0.5rem; }

.payment-history { border-top: 1px solid var(--border-lt); padding-top: 1rem; }
.payment-history-title { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-soft); margin-bottom: 0.75rem; }
.payment-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 10px 0; border-bottom: 1px solid var(--border-lt); }
.payment-row:last-child { border-bottom: none; }
.payment-row-month { font-size: 13px; color: var(--text-mid); }
.payment-row-status { font-size: 11px; font-weight: 500; }
.payment-row-status.paid { color: var(--green); }
.payment-row-status.unpaid { color: var(--red); }

/* JELENLÉT */
.attendance-months { display: flex; flex-direction: column; gap: 1rem; }
.month-block { }
.month-name { font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; font-weight: 400; color: var(--charcoal); margin-bottom: 0.6rem; display: flex; align-items: center; justify-content: space-between; }
.month-score { font-size: 12px; color: var(--text-soft); font-family: 'Inter', sans-serif; }
.month-score.good { color: var(--green); }
.month-score.warn { color: var(--orange); }
.attendance-list { display: flex; flex-direction: column; gap: 0.4rem; }
.attendance-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--ivory); border: 1px solid var(--border-lt); }
.att-icon { font-size: 14px; flex-shrink: 0; }
.att-date { font-size: 13px; color: var(--text-mid); flex: 1; }
.att-status { font-size: 11px; font-weight: 500; }
.att-status.present { color: var(--green); }
.att-status.absent { color: var(--text-soft); }

/* ADATOK */
.data-grid { display: flex; flex-direction: column; gap: 0; }
.data-row { display: flex; gap: 1rem; padding: 10px 0; border-bottom: 1px solid var(--border-lt); align-items: flex-start; }
.data-row:last-child { border-bottom: none; }
.data-label { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-soft); min-width: 130px; padding-top: 2px; flex-shrink: 0; }
.data-value { font-size: 14px; color: var(--charcoal); flex: 1; }
.data-value.editable { cursor: pointer; border-bottom: 1px dashed var(--border); padding-bottom: 1px; transition: border-color 0.2s; }
.data-value.editable:hover { border-color: var(--green); color: var(--green-dark); }
.data-input { font-size: 14px; color: var(--charcoal); border: 1px solid var(--green); padding: 4px 8px; width: 100%; font-family: 'Inter', sans-serif; outline: none; background: var(--ivory); }
.data-optional { font-size: 10px; color: var(--text-soft); margin-left: 6px; }
.edit-btn { width: 100%; padding: 12px; background: var(--green); color: white; border: none; font-size: 12px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; font-family: 'Inter', sans-serif; transition: background 0.2s; margin-top: 1rem; display: none; }
.edit-btn:hover { background: var(--green-dark); }
.save-btn { width: 100%; padding: 12px; background: var(--green); color: white; border: none; font-size: 12px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; font-family: 'Inter', sans-serif; transition: background 0.2s; margin-top: 1rem; display: none; }
.save-btn:hover { background: var(--green-dark); }

/* TABS */
.tabs { display: flex; gap: 0; margin-bottom: 1.5rem; border: 1px solid var(--border); }
.tab { flex: 1; padding: 11px; border: none; background: white; font-size: 11px; color: var(--text-soft); cursor: pointer; font-family: 'Inter', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; border-right: 1px solid var(--border); transition: all 0.2s; }
.tab:last-child { border-right: none; }
.tab.active { background: var(--green); color: white; }

.tab-content { display: none; }
.tab-content.active { display: block; }

/* TOAST */
.toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--charcoal); color: white; padding: 12px 24px; font-size: 13px; border-radius: 2px; box-shadow: var(--shadow-lg); transition: transform 0.3s; white-space: nowrap; z-index: 300; }
.toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>

let currentChild = null;
let editMode = false;

const API_URL = '/api/sheets';

async function loadChildFromSheets(pin) {
  try {
    const data = await fetch(`${API_URL}?action=getChildren`);
    const json = await data.json();
    if (json.children) {
      return json.children.find(c => String(c.pin) === String(pin)) || null;
    }
  } catch(e) {
    console.error('Sheets betöltési hiba:', e);
    return null;
  }
}

async function saveProfileToSheets(child) {
  try {
    await fetch(`${API_URL}?action=saveChild`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(child)
    });
  } catch(e) {
    console.error('Sheets mentési hiba:', e);
  }
}

function onPinKey(e) {
  if (e.key === 'Enter') doLogin();
  document.getElementById('pinInput').classList.remove('error');
  document.getElementById('pinError').classList.remove('show');
}

async function doLogin() {
  const pin = document.getElementById('pinInput').value.trim();
  const btn = document.querySelector('.login-btn');
  btn.textContent = 'Betöltés...';
  btn.disabled = true;

  // Try Sheets first
  let child = await loadChildFromSheets(pin);

  // Fallback to demo database
  if (!child) child = database[pin];

  btn.textContent = 'Belépés';
  btn.disabled = false;

  if (!child) {
    document.getElementById('pinInput').classList.add('error');
    document.getElementById('pinError').classList.add('show');
    document.getElementById('pinInput').value = '';
    return;
  }
  currentChild = child;
  showDashboard(child);
}

function showDashboard(child) {
  document.getElementById('loginWrap').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  document.getElementById('logoutBtn').style.display = 'block';

  // Header
  const initials = child.name.split(' ').map(n => n[0]).join('');
  document.getElementById('childInitials').textContent = initials;
  document.getElementById('childNameHeader').textContent = child.name;
  document.getElementById('childGroupHeader').textContent = child.group;

  renderAttendance(child);
  renderPayment(child);
  renderProfile(child);
}

async function renderAttendance(child) {
  const list = document.getElementById('attendanceList');
  list.innerHTML = '<div style="padding:1rem;color:var(--text-soft);font-style:italic;">Betöltés...</div>';

  try {
    const resp = await fetch(`/api/sheets?action=getAttendance&group=${encodeURIComponent(child.group)}`);
    const data = await resp.json();

    if (!data.dates || data.dates.length === 0) {
      list.innerHTML = '<div style="padding:1rem;color:var(--text-soft);font-style:italic;">Még nincs rögzített jelenlét.</div>';
      return;
    }

    // Group dates by month
    const byMonth = {};
    data.dates.forEach(date => {
      if (!date) return;
      const parts = date.split('.');
      const month = parts[1] ? parts[1].trim().padStart(2, '0') : '??';
      if (!byMonth[month]) byMonth[month] = [];
      byMonth[month].push(date);
    });

    const childAtt = data.attendance[child.name] || {};

    list.innerHTML = Object.entries(byMonth).map(([month, dates]) => {
      const present = dates.filter(d => childAtt[d]).length;
      const total = dates.length;
      const scoreClass = present >= total * 0.75 ? 'good' : present >= total * 0.5 ? 'warn' : 'bad';
      return `
        <div class="card">
          <div class="card-body">
            <div class="month-name">
              ${monthNames[month] || month}
              <span class="month-score ${scoreClass}">${present}/${total} alkalom</span>
            </div>
            <div class="attendance-list">
              ${dates.map(d => `
                <div class="attendance-item">
                  <span class="att-icon">${childAtt[d] ? '✅' : '○'}</span>
                  <span class="att-date">${d}</span>
                  <span class="att-status ${childAtt[d] ? 'present' : 'absent'}">${childAtt[d] ? 'Jelen volt' : 'Hiányzott'}</span>
                </div>`).join('')}
            </div>
          </div>
        </div>`;
    }).join('');

  } catch(e) {
    console.error('Jelenlét betöltési hiba:', e);
    list.innerHTML = '<div style="padding:1rem;color:var(--red);">Jelenlét betöltése sikertelen.</div>';
  }
}

const months = ["09", "10", "11", "12", "01", "02", "03", "04", "05"];
const monthNames = {
  "09": "Szeptember", "10": "Október", "11": "November", "12": "December",
  "01": "Január", "02": "Február", "03": "Március", "04": "Április", "05": "Május"
};

async function renderPayment(child) {
  // Load payments from Sheets
  let payments = {};
  try {
    const resp = await fetch(`/api/sheets?action=getChildPayments&childName=${encodeURIComponent(child.name)}`);
    const data = await resp.json();
    payments = data.payments || {};
  } catch(e) {
    console.error('Fizetés betöltési hiba:', e);
  }

  // Get fee from child data or from Sheets children list
  const fee = parseInt(child.monthlyFee) || 0;
  const feeStr = fee > 0 ? fee.toLocaleString('hu-HU') + ' Ft' : 'Nincs megadva';

  // Show fee at top
  document.getElementById('paymentNote').textContent = `Havi díj: ${feeStr}`;

  document.getElementById('paymentHistory').innerHTML = months.map(m => {
    const status = payments[m] || 'unpaid';
    const isPaid = status === 'paid';
    return `
      <div class="payment-row">
        <span class="payment-row-month">${monthNames[m]}</span>
        <span class="payment-row-status ${status}">${isPaid ? '✓ Fizetve' : '✗ Nem fizetve'}</span>
      </div>`;
  }).join('');

  // Current month summary
  const currentMonth = String(new Date().getMonth() + 1).padStart(2, '0');
  const currentStatus = payments[currentMonth] || 'unpaid';
  const isPaid = currentStatus === 'paid';
  document.getElementById('currentPaymentBadge').textContent = isPaid ? '✓ Fizetve' : '✗ Nem fizetve';
  document.getElementById('currentPaymentBadge').className = 'payment-badge ' + (isPaid ? 'paid' : 'unpaid');
  document.getElementById('currentPaymentMonth').textContent = monthNames[currentMonth] || '';
  document.getElementById('paymentNote').textContent = isPaid
    ? 'A havi díj beérkezett, köszönjük!'
    : 'A havi díj még nem érkezett be. Kérjük rendezd mielőbb!';
}

function renderProfile(child) {
  const fields = [
    { label: 'Gyermek neve', key: 'name', required: true },
    { label: 'Születési dátum', key: 'birthdate', required: true },
    { label: 'Szülő neve', key: 'parentName', required: true },
    { label: 'Szülő telefonszáma', key: 'parentPhone', required: true },
    { label: 'Szülő email', key: 'parentEmail', required: true },
    { label: 'Számlázási cím', key: 'billingAddress', required: true },
    { label: 'Gyermek telefonja', key: 'childPhone', required: false },
    { label: 'Gyermek emailje', key: 'childEmail', required: false },
  ];

  const stylesRow = child.styles && child.styles.length > 0
    ? `<div class="data-row">
        <span class="data-label">Táncstílusok</span>
        <span class="data-value">
          ${child.styles.map(s => `<span style="display:inline-block;background:var(--green-bg);color:var(--green-dark);font-size:11px;padding:3px 10px;margin:2px;letter-spacing:0.06em;">${s}</span>`).join('')}
        </span>
       </div>`
    : '';

  document.getElementById('dataGrid').innerHTML = stylesRow + fields.map(f => `
    <div class="data-row">
      <span class="data-label">${f.label}${!f.required ? '<span class="data-optional">(nem kötelező)</span>' : ''}</span>
      <span class="data-value" data-key="${f.key}">${child[f.key] || '—'}</span>
    </div>
  `).join('');
}

function toggleEdit() {
  editMode = !editMode;
  const grid = document.getElementById('dataGrid');
  const saveBtn = document.getElementById('saveBtn');

  if (editMode) {
    // Switch to inputs - only elements with data-key attribute
    grid.querySelectorAll('.data-value[data-key]').forEach(span => {
      const key = span.dataset.key;
      const val = currentChild[key] || '';
      const input = document.createElement('input');
      input.className = 'data-input';
      input.value = val;
      input.dataset.key = key;
      span.replaceWith(input);
    });
    saveBtn.style.display = 'block';
    document.querySelector('.card-action').textContent = 'Mégsem';
  } else {
    renderProfile(currentChild);
    saveBtn.style.display = 'none';
    document.querySelector('.card-action').textContent = 'Szerkesztés';
  }
}

function saveData() {
  document.querySelectorAll('.data-input').forEach(input => {
    currentChild[input.dataset.key] = input.value;
  });
  editMode = false;
  renderProfile(currentChild);
  document.getElementById('saveBtn').style.display = 'none';
  document.querySelector('.card-action').textContent = 'Szerkesztés';

  saveProfileToSheets(currentChild);
  showToast('Adatok mentve! ✓');
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  event.target.classList.add('active');
}

function logout() {
  currentChild = null;
  document.getElementById('loginWrap').style.display = 'flex';
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('logoutBtn').style.display = 'none';
  document.getElementById('pinInput').value = '';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
</body>
</html>
