<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Beléptető — Basic Táncstúdió</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --green:      #3D7A68;
  --green-bg:   #EAF2EF;
  --green-mid:  #6AA898;
  --green-dark: #2A5E50;
  --green-deep: #1E4A3E;
  --cream:      #F5F0E8;
  --ivory:      #FAF8F5;
  --charcoal:   #1E1C1A;
  --text-mid:   #4A4540;
  --text-soft:  #8A837C;
  --border:     #DDD6CE;
  --border-lt:  #EDE7E1;
  --shadow-sm:  0 2px 12px rgba(30,28,26,0.06);
  --shadow-md:  0 8px 32px rgba(30,28,26,0.12);
}
html, body { height: 100%; }
body { font-family: 'Inter', sans-serif; background: var(--ivory); color: var(--charcoal); font-size: 16px; }

.header {
  background: var(--green-deep);
  padding: 1rem 1.5rem;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: var(--shadow-md);
}
.header-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.header-logo { width: 36px; height: 36px; border-radius: 50%; object-fit: contain; background: white; padding: 4px; }
.header-name { font-family: 'Cormorant Garamond', serif; font-size: 1rem; color: white; letter-spacing: 0.08em; text-transform: uppercase; }
.header-badge { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--green-mid); background: rgba(106,168,152,0.15); padding: 4px 10px; border: 1px solid rgba(106,168,152,0.3); }

.main { max-width: 480px; margin: 0 auto; padding: 1.5rem; }

.date-row { display: flex; gap: 1rem; margin-bottom: 1.5rem; }
.date-box { flex: 1; background: white; border: 1px solid var(--border); padding: 12px 16px; box-shadow: var(--shadow-sm); }
.label { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-soft); margin-bottom: 6px; display: block; }
.date-value { font-family: 'Cormorant Garamond', serif; font-size: 1.3rem; font-weight: 300; color: var(--charcoal); }
.date-sub { font-size: 11px; color: var(--text-soft); letter-spacing: 0.06em; margin-top: 2px; }

.scanner-section { margin-bottom: 1.5rem; }
.scanner-box { background: white; border: 1px solid var(--border); box-shadow: var(--shadow-sm); overflow: hidden; }
.scanner-header { padding: 1rem 1.25rem; border-bottom: 1px solid var(--border-lt); display: flex; align-items: center; justify-content: space-between; }
.scanner-title { font-size: 13px; font-weight: 500; color: var(--charcoal); letter-spacing: 0.04em; }
.scanner-status { font-size: 11px; color: var(--text-soft); }
.scanner-status.active { color: var(--green); }

#qr-reader { width: 100% !important; }
#qr-reader video { width: 100% !important; }
#qr-reader img { display: none; }

.scan-btn {
  width: 100%; padding: 16px;
  background: var(--green); color: white; border: none;
  font-size: 13px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase;
  cursor: pointer; font-family: 'Inter', sans-serif;
  transition: background 0.2s; box-shadow: 0 4px 16px rgba(61,122,104,0.3);
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.scan-btn:hover { background: var(--green-dark); }
.scan-btn.stop { background: var(--text-soft); box-shadow: none; }

.log-section { }
.log-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
.log-title { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-soft); }
.log-count { font-size: 12px; color: var(--green); font-weight: 500; }
.log-list { display: flex; flex-direction: column; gap: 0.5rem; }
.log-item { background: white; border: 1px solid var(--border-lt); padding: 12px 16px; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow-sm); animation: slideIn 0.3s ease; }
@keyframes slideIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
.log-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
.log-info { flex: 1; }
.log-name { font-size: 14px; color: var(--charcoal); }
.log-group { font-size: 11px; color: var(--text-soft); margin-top: 2px; }
.log-time { font-size: 11px; color: var(--text-soft); }
.log-empty { background: white; border: 1px solid var(--border-lt); padding: 2rem; text-align: center; font-size: 13px; color: var(--text-soft); font-style: italic; }

/* RESULT POPUP */
.result-overlay { position: fixed; inset: 0; background: rgba(30,28,26,0.6); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 1.5rem; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
.result-overlay.show { opacity: 1; pointer-events: all; }
.result-card { background: white; width: 100%; max-width: 360px; padding: 2.5rem 2rem; text-align: center; box-shadow: 0 24px 64px rgba(30,28,26,0.2); transform: translateY(20px); transition: transform 0.3s; }
.result-overlay.show .result-card { transform: translateY(0); }
.result-icon { font-size: 3.5rem; margin-bottom: 1rem; }
.result-name { font-family: 'Cormorant Garamond', serif; font-size: 2rem; font-weight: 300; color: var(--charcoal); margin-bottom: 0.4rem; }
.result-group { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--green); margin-bottom: 0.4rem; }
.result-time { font-size: 13px; color: var(--text-soft); margin-bottom: 1.5rem; }
.result-msg { font-size: 14px; color: var(--text-mid); margin-bottom: 2rem; line-height: 1.6; }
.result-close { width: 100%; padding: 13px; background: var(--green); color: white; border: none; font-size: 12px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; font-family: 'Inter', sans-serif; transition: background 0.2s; }
.result-close:hover { background: var(--green-dark); }
.result-card.warning .result-close { background: #E67E22; }
.result-card.error .result-name { color: #C0392B; }
.result-card.error .result-close { background: #C0392B; }
</style>
</head>

    <button class="scan-btn" id="scanBtn" onclick="toggleScanner()">
      📷 Kamera indítása
    </button>
  </div>

  <div class="log-section">
    <div class="log-header">
      <span class="log-title">Mai bejelentkezések</span>
      <span class="log-count" id="logCount">0 fő</span>
    </div>
    <div class="log-list" id="logList">
      <div class="log-empty">Még nincs bejelentkezés ma.</div>
    </div>
  </div>

</div>

<div class="result-overlay" id="resultOverlay">
  <div class="result-card" id="resultCard">
    <div class="result-icon" id="resultIcon">✅</div>
    <div class="result-name" id="resultName">—</div>
    <div class="result-group" id="resultGroup">—</div>
    <div class="result-time" id="resultTime">—</div>
    <div class="result-msg" id="resultMsg">—</div>
    <button class="result-close" onclick="closeResult()">Tovább →</button>
  </div>
</div>

<script>
let scanning = false;
let html5QrCode = null;
let checkIns = [];
let lastScanned = null;
let lastScannedTime = 0;

const API_URL = '/api/sheets';
let sheetsChildren = {};

async function loadChildrenFromSheets() {
  try {
    const resp = await fetch(`${API_URL}?action=getChildren`);
    const data = await resp.json();
    if (data.children) {
      sheetsChildren = {};
      data.children.forEach(c => {
        sheetsChildren[c.id] = { name: c.name, group: c.group };
      });
    }
  } catch(e) {
    console.error('Sheets betöltési hiba:', e);
  }
}

async function saveAttendanceToSheets(childName, group, date) {
  try {
    await fetch(`${API_URL}?action=saveAttendance`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ childName, group, date })
    });
  } catch(e) {
    console.error('Sheets mentési hiba:', e);
  }
}

// DEMO adatbázis - fallback ha nincs Sheets kapcsolat
const children = {
  "BASIC-001": { name: "Kiss Anna",    group: "Mesebalett" },
  "BASIC-002": { name: "Nagy Péter",   group: "Közepesek" },
  "BASIC-003": { name: "Kovács Lili",  group: "Péntekiek" },
  "BASIC-004": { name: "Szabó Bence",  group: "Szombati nagyok" },
  "BASIC-005": { name: "Tóth Emma",    group: "Mesebalett" },
};

function updateDate() {
  const now = new Date();
  const days = ['Vasárnap','Hétfő','Kedd','Szerda','Csütörtök','Péntek','Szombat'];
  document.getElementById('todayDate').textContent =
    now.toLocaleDateString('hu-HU', { year:'numeric', month:'long', day:'numeric' });
  document.getElementById('todayDay').textContent = days[now.getDay()];
}
updateDate();
loadChildrenFromSheets();

function toggleScanner() {
  if (scanning) stopScanner();
  else startScanner();
}

function startScanner() {
  scanning = true;
  document.getElementById('scanBtn').textContent = '⏹ Kamera leállítása';
  document.getElementById('scanBtn').classList.add('stop');
  document.getElementById('scannerStatus').textContent = 'Aktív';
  document.getElementById('scannerStatus').classList.add('active');

  html5QrCode = new Html5Qrcode("qr-reader");
  html5QrCode.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: 250, height: 250 } },
    onScanSuccess,
    () => {}
  ).catch(() => {
    stopScanner();
    showError('Nem sikerült elindítani a kamerát. Engedélyezd a kamera hozzáférést!');
  });
}

function stopScanner() {
  if (html5QrCode) {
    html5QrCode.stop().then(() => { html5QrCode.clear(); html5QrCode = null; });
  }
  scanning = false;
  document.getElementById('scanBtn').textContent = '📷 Kamera indítása';
  document.getElementById('scanBtn').classList.remove('stop');
  document.getElementById('scannerStatus').textContent = 'Inaktív';
  document.getElementById('scannerStatus').classList.remove('active');
}

function onScanSuccess(qrCode) {
  const now = Date.now();
  if (qrCode === lastScanned && now - lastScannedTime < 3000) return;
  lastScanned = qrCode;
  lastScannedTime = now;

  const child = sheetsChildren[qrCode] || children[qrCode];
  const time = new Date().toLocaleTimeString('hu-HU', { hour:'2-digit', minute:'2-digit' });

  if (!child) {
    showError('Ismeretlen QR kód!');
    return;
  }

  const alreadyIn = checkIns.find(c => c.id === qrCode);
  if (alreadyIn) {
    showWarning(child.name, child.group, alreadyIn.time);
    return;
  }

  checkIns.push({ id: qrCode, name: child.name, group: child.group, time });
  updateLog();
  showSuccess(child.name, child.group, time);

  // TODO: Google Sheets mentés
  // saveToSheets(child.name, child.group, new Date());
}

function showSuccess(name, group, time) {
  document.getElementById('resultCard').className = 'result-card';
  document.getElementById('resultIcon').textContent = '✅';
  document.getElementById('resultName').textContent = name;
  document.getElementById('resultGroup').textContent = group;
  document.getElementById('resultTime').textContent = time;
  document.getElementById('resultMsg').textContent = 'Sikeresen bejelentkezve!';
  document.getElementById('resultOverlay').classList.add('show');
}

function showWarning(name, group, firstTime) {
  document.getElementById('resultCard').className = 'result-card warning';
  document.getElementById('resultIcon').textContent = '⚠️';
  document.getElementById('resultName').textContent = name;
  document.getElementById('resultGroup').textContent = group;
  document.getElementById('resultTime').textContent = 'Első bejelentkezés: ' + firstTime;
  document.getElementById('resultMsg').textContent = 'Ez a tanuló ma már bejelentkezett!';
  document.getElementById('resultOverlay').classList.add('show');
}

function showError(msg) {
  document.getElementById('resultCard').className = 'result-card error';
  document.getElementById('resultIcon').textContent = '❌';
  document.getElementById('resultName').textContent = 'Hiba';
  document.getElementById('resultGroup').textContent = '';
  document.getElementById('resultTime').textContent = '';
  document.getElementById('resultMsg').textContent = msg;
  document.getElementById('resultOverlay').classList.add('show');
}

function closeResult() {
  document.getElementById('resultOverlay').classList.remove('show');
}

function updateLog() {
  const count = checkIns.length;
  document.getElementById('logCount').textContent = count + ' fő';
  document.getElementById('checkInCount').textContent = count;
  document.getElementById('logList').innerHTML = count === 0
    ? '<div class="log-empty">Még nincs bejelentkezés ma.</div>'
    : checkIns.slice().reverse().map(c => `
        <div class="log-item">
          <div class="log-dot"></div>
          <div class="log-info">
            <div class="log-name">${c.name}</div>
            <div class="log-group">${c.group}</div>
          </div>
          <div class="log-time">${c.time}</div>
        </div>`).join('');
}
</script>
</div><!-- tanarApp -->

<script>
const TANAR_PASSWORD = "tanar2025";

  if (pass === TANAR_PASSWORD) {

    document.getElementById("tanarPass").style.borderColor = "#C0392B";
    setTimeout(() => { document.getElementById("tanarPass").style.borderColor = "var(--border)"; }, 2000);
  }
}
</script>
</body>
